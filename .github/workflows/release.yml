name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: List APK files
        run: |
          echo "📁 Listing APK files..."
          find app/build/outputs/apk -name "*.apk" -type f

      - name: Get version info
        id: version
        run: |
          # 使用固定版本，因为 Kotlin DSL 解析比较复杂
          VERSION_NAME="1.0"
          VERSION_CODE=1
          BUILD_NUMBER=${{ github.run_number }}

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "📱 Building version: $VERSION_NAME (Build $BUILD_NUMBER)"

      - name: Rename APK with version
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            mv app/build/outputs/apk/debug/app-debug.apk \
               app/build/outputs/apk/debug/menu-app-v${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.build_number }}.apk
            echo "✅ APK renamed successfully"
            ls -lh app/build/outputs/apk/debug/
          else
            echo "❌ APK file not found!"
            exit 1
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.build_number }}
          name: Menu App v${{ steps.version.outputs.version_name }} (Build ${{ steps.version.outputs.build_number }})
          body: |
            ## 🎉 新版本发布

            **版本**: v${{ steps.version.outputs.version_name }}
            **构建号**: ${{ steps.version.outputs.build_number }}
            **日期**: ${{ github.event.head_commit.timestamp }}

            ### 📱 安装方法
            1. 下载 APK 文件
            2. 在手机上打开
            3. 允许安装未知来源应用
            4. 完成安装

            ### 📋 更新内容
            ${{ github.event.head_commit.message }}

            ### ⚙️ 功能列表
            - ✅ 菜品管理（增删改查）
            - ✅ 搭配组合
            - ✅ 今日菜单
            - ✅ 历史记录
            - ✅ 统计信息

            ### 📲 系统要求
            - Android 7.0 (API 24) 或更高版本
            - 约 10MB 存储空间

            ---
            **提交**: ${{ github.sha }}
            **分支**: ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/debug/menu-app-v${{ steps.version.outputs.version_name }}-build${{ steps.version.outputs.build_number }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: menu-app-apk
          path: app/build/outputs/apk/debug/menu-app-v${{ steps.version.outputs.version_name }}-build${{ steps.version.outputs.build_number }}.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "## 🎉 构建完成！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: v${{ steps.version.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**构建号**: ${{ steps.version.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 下载链接" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "📦 **GitHub Release**: 即将创建" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- APK 文件已上传到 Artifacts（保留 30 天）" >> $GITHUB_STEP_SUMMARY
